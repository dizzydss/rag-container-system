version: '3.8'

services:
  rag-app:
    build: ./app
    container_name: rag-app
    ports:
      - "8000:8000"
    environment:
      - LLAMA_CPP_URL=http://host.docker.internal:8080/v1
    volumes:
      - ./data:/app/data
      - chroma_data:/chroma/chroma
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - chroma

  chroma:
    image: chromadb/chroma:latest
    container_name: chroma-db
    ports:
      - "8002:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  proxy:
    build: ./proxy
    container_name: rag-proxy
    ports:
      - "8001:8001"
    depends_on:
      - rag-app

volumes:
  chroma_data:
